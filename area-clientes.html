<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área de Clientes · Bendito Lab</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.benditolab.com/portal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{ --poppy:#E2704A; --white:#FBF4E9; --sage:#9AB791; --deep:#17233F; }
*{box-sizing:border-box;}
body{margin:0;background:var(--poppy);min-height:100vh;font-family:'Inter',sans-serif;color:var(--white);position:relative;}
a{color:inherit;text-decoration:none;}
h1{font-family:'Helvetica World','Helvetica Neue',Helvetica,Arial,sans-serif;margin:0;}
input::placeholder{color:var(--poppy);opacity:.7;}
.back-btn{position:fixed;left:32px;bottom:32px;background:transparent;border:1px solid var(--white);font-weight:700;font-size:13px;padding:10px 20px;border-radius:20px;}
.wrap{max-width:700px;margin:0 auto;padding:120px 24px 80px;text-align:center;}
.wrap h1{font-weight:800;font-size:clamp(30px,6vw,54px);line-height:1.15;margin:0 0 56px;}
form{display:flex;flex-direction:column;gap:20px;align-items:center;}
.field{width:100%;max-width:420px;padding:16px 22px;border-radius:24px;border:none;font-weight:700;font-size:15px;background:var(--white);color:var(--poppy);text-align:center;box-sizing:border-box;}
.btn-enter{background:var(--sage);color:var(--deep);font-weight:700;font-size:15px;padding:16px 40px;border-radius:24px;border:none;cursor:pointer;}
.hint{margin:24px 0 0;font-size:13px;opacity:.85;}
.brands{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:56px;}
.brands img{height:28px;width:auto;filter:brightness(0) invert(1);}
@media(max-width:600px){ .back-btn{left:16px;bottom:16px;} }
</style>
  <link rel="icon" type="image/svg+xml" href="/images/eye-logo-azul.svg">
  <link rel="apple-touch-icon" href="/icon-web-azul-180.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icon-web-azul-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-web-azul-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-web-azul-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-web-azul-512.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

<a href="portada.html" class="back-btn">VOLVER→</a>

<div class="wrap">
  <h1 data-edit="area-clientes.hero.h1">PORTAL DE CLIENTES Y COLABORADORES</h1>

  <a class="btn-enter" href="https://portal.benditolab.com/portal" style="display:inline-block;" data-edit="area-clientes.hero.cta">ENTRAR→</a>

  <p class="hint" data-edit="area-clientes.hero.hint">Accede a Bendito OS, tu área privada de presupuestos y pedidos.</p>

  <div class="brands">
    <img src="logo-bendito.png" alt="Bendito Lab">
    <img src="images/eye-logo.svg" alt="" style="height:32px;width:32px;">
    <img src="logo.webp" alt="Dilo Bonito">
  </div>

  <p style="margin-top:40px;font-size:12px;opacity:.85;">
    <a href="#" data-modal="aviso" style="text-decoration:underline;">Aviso legal</a> ·
    <a href="#" data-modal="privacidad" style="text-decoration:underline;">Política de privacidad</a> ·
    <a href="#" data-modal="cookies" style="text-decoration:underline;">Política de cookies</a>
  </p>
</div>

<div id="modal-legal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100000;overflow-y:auto;padding:40px 16px;">
  <div style="background:#fff;max-width:760px;margin:0 auto;border-radius:12px;padding:40px;font-family:Arial,sans-serif;font-size:14px;line-height:1.7;color:#222;position:relative;">
    <button id="btn-cerrar-modal" style="position:absolute;top:16px;right:20px;background:none;border:none;font-size:22px;cursor:pointer;color:#888;">✕</button>
    <div id="modal-contenido"></div>
  </div>
</div>

<div id="cookie-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#17233F;color:#fff;padding:16px 24px;z-index:99999;font-family:Arial,sans-serif;font-size:13px;box-shadow:0 -2px 12px rgba(0,0,0,0.3);align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
  <span style="flex:1;min-width:200px;">
    🍪 Usamos cookies propias y de Google Analytics para mejorar tu experiencia.
    <a href="#" data-modal="privacidad" style="color:#E8C24A;text-decoration:underline;">Privacidad</a> ·
    <a href="#" data-modal="cookies" style="color:#E8C24A;text-decoration:underline;">Cookies</a>
  </span>
  <div style="display:flex;gap:8px;flex-shrink:0;">
    <button id="btn-rechazar-cookies" style="background:transparent;border:1px solid #E8C24A;color:#E8C24A;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;">Rechazar</button>
    <button id="btn-aceptar-cookies" style="background:#E8C24A;border:none;color:#17233F;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;">Aceptar</button>
  </div>
</div>

<script src="js/area-clientes-1.js"></script>
</body>
</html>
