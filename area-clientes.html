<style>
:root{ --poppy:#E2704A; --white:#FBF4E9; --sage:#9AB791; --deep:#17233F; }
*{box-sizing:border-box;}
body{margin:0;background:var(--poppy);min-height:100vh;font-family:'Inter',sans-serif;color:var(--white);position:relative;}
a{color:inherit;text-decoration:none;}
h1{font-family:'Helvetica World','Helvetica Neue',Helvetica,Arial,sans-serif;margin:0;}
input::placeholder{color:var(--poppy);opacity:.7;}
.back-btn{position:fixed;left:32px;bottom:32px;background:transparent;border:1px solid var(--white);font-weight:700;font-size:13px;padding:10px 20px;border-radius:20px;}
.wrap{max-width:700px;margin:0 auto;padding:120px 24px 80px;text-align:center;}
.wrap h1{font-weight:800;font-size:clamp(30px,6vw,54px);line-height:1.15;margin:0 0 56px;}
form{display:flex;flex-direction:column;gap:20px;align-items:center;}
.field{width:100%;max-width:420px;padding:16px 22px;border-radius:24px;border:none;font-weight:700;font-size:15px;background:var(--white);color:var(--poppy);text-align:center;box-sizing:border-box;}
.btn-enter{background:var(--sage);color:var(--deep);font-weight:700;font-size:15px;padding:16px 40px;border-radius:24px;border:none;cursor:pointer;}
.hint{margin:24px 0 0;font-size:13px;opacity:.85;}
.brands{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:56px;}
.brands img{height:28px;width:auto;filter:brightness(0) invert(1);}
@media(max-width:600px){ .back-btn{left:16px;bottom:16px;} }
</style>
  <link rel="apple-touch-icon" href="/icon-web-180.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icon-web-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-web-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-web-192.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

<a href="portada.html" class="back-btn">VOLVER→</a>

<div class="wrap">
  <h1>PORTAL DE CLIENTES Y COLABORADORES</h1>

  <a class="btn-enter" href="https://portal.benditolab.com/portal" style="display:inline-block;">ENTRAR→</a>

  <p class="hint">Accede a Bendito OS, tu área privada de presupuestos y pedidos.</p>

  <div class="brands">
    <img src="logo-bendito.png" alt="Bendito Lab">
    <img src="images/eye-logo.svg" alt="" style="height:32px;width:32px;">
    <img src="logo.png" alt="Dilo Bonito">
  </div>

  <p style="margin-top:40px;font-size:12px;opacity:.85;">
    <a href="#" onclick="abrirModal('aviso');return false;" style="text-decoration:underline;">Aviso legal</a> ·
    <a href="#" onclick="abrirModal('privacidad');return false;" style="text-decoration:underline;">Política de privacidad</a> ·
    <a href="#" onclick="abrirModal('cookies');return false;" style="text-decoration:underline;">Política de cookies</a>
  </p>
</div>

<div id="modal-legal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100000;overflow-y:auto;padding:40px 16px;">
  <div style="background:#fff;max-width:760px;margin:0 auto;border-radius:12px;padding:40px;font-family:Arial,sans-serif;font-size:14px;line-height:1.7;color:#222;position:relative;">
    <button onclick="cerrarModal()" style="position:absolute;top:16px;right:20px;background:none;border:none;font-size:22px;cursor:pointer;color:#888;">✕</button>
    <div id="modal-contenido"></div>
  </div>
</div>

<div id="cookie-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#17233F;color:#fff;padding:16px 24px;z-index:99999;font-family:Arial,sans-serif;font-size:13px;box-shadow:0 -2px 12px rgba(0,0,0,0.3);align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
  <span style="flex:1;min-width:200px;">
    🍪 Usamos cookies propias y de Google Analytics para mejorar tu experiencia.
    <a href="#" onclick="abrirModal('privacidad');return false;" style="color:#E8C24A;text-decoration:underline;">Privacidad</a> ·
    <a href="#" onclick="abrirModal('cookies');return false;" style="color:#E8C24A;text-decoration:underline;">Cookies</a>
  </span>
  <div style="display:flex;gap:8px;flex-shrink:0;">
    <button onclick="rechazarCookies()" style="background:transparent;border:1px solid #E8C24A;color:#E8C24A;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;">Rechazar</button>
    <button onclick="aceptarCookies()" style="background:#E8C24A;border:none;color:#17233F;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;">Aceptar</button>
  </div>
</div>

<script>
var textoAviso = `<h2 style="color:#17233F;margin-top:0">Aviso Legal</h2>
<ul>
<li><strong>Titular:</strong> Silvia G. M. · NIF: 05931103-R</li>
<li><strong>Domicilio:</strong> Calle Independencia 65, 13200 Manzanares, Ciudad Real</li>
<li><strong>Email:</strong> <a href="mailto:contacto@benditolab.com">contacto@benditolab.com</a></li>
<li><strong>Actividad:</strong> Personalización y merchandising (Bendito Lab · Dilo Bonito)</li>
</ul>
<p>Todos los contenidos del sitio son propiedad de la titular o de terceros autorizados. Queda prohibida su reproducción sin autorización escrita. Legislación española aplicable — Juzgados de Manzanares, Ciudad Real.</p>`;

var textoCookies = `<h2 style="color:#17233F;margin-top:0">Política de Cookies</h2>
<table style="width:100%;border-collapse:collapse;font-size:13px;">
<tr style="background:#f5f5f5;"><th style="padding:8px;border:1px solid #ddd;text-align:left;">Cookie</th><th style="padding:8px;border:1px solid #ddd;text-align:left;">Tipo</th><th style="padding:8px;border:1px solid #ddd;text-align:left;">Finalidad</th><th style="padding:8px;border:1px solid #ddd;text-align:left;">Duración</th></tr>
<tr><td style="padding:8px;border:1px solid #ddd;">bl_cookie_consent</td><td style="padding:8px;border:1px solid #ddd;">Técnica propia</td><td style="padding:8px;border:1px solid #ddd;">Guardar tu preferencia</td><td style="padding:8px;border:1px solid #ddd;">1 año</td></tr>
<tr><td style="padding:8px;border:1px solid #ddd;">_ga, _gid, _gat</td><td style="padding:8px;border:1px solid #ddd;">Analítica (Google)</td><td style="padding:8px;border:1px solid #ddd;">Análisis anónimo del tráfico</td><td style="padding:8px;border:1px solid #ddd;">Hasta 2 años</td></tr>
</table>
<p style="margin-top:16px;">Puedes rechazar o retirar el consentimiento en cualquier momento. Desactivar Analytics: <a href="https://tools.google.com/dlpage/gaoptout" target="_blank">tools.google.com/dlpage/gaoptout</a></p>`;

var textoPrivacidad = `<h2 style="color:#17233F;margin-top:0">Política de Privacidad</h2>
<p><strong>Responsable:</strong> Silvia G. M. · NIF 05931103-R · <a href="mailto:contacto@benditolab.com">contacto@benditolab.com</a></p>
<p><strong>Datos recabados:</strong> A través del formulario de contacto: nombre, email, teléfono (opcional) y mensaje. Finalidad: gestionar tu consulta o relación comercial.</p>
<p><strong>Base legal:</strong> Consentimiento (art. 6.1.a RGPD) y ejecución de contrato (art. 6.1.b RGPD).</p>
<p><strong>Conservación:</strong> Durante el tiempo necesario y los plazos legales (hasta 5 años).</p>
<p><strong>Terceros:</strong> Google Analytics (Google LLC, adherida al Data Privacy Framework UE-EE.UU.).</p>
<p><strong>Tus derechos:</strong> Acceso, rectificación, supresión, oposición, limitación y portabilidad. Escríbenos a <a href="mailto:contacto@benditolab.com">contacto@benditolab.com</a> o reclama ante la <a href="https://www.aepd.es" target="_blank">AEPD</a>.</p>`;
function abrirModal(tipo) {
  document.getElementById('modal-contenido').innerHTML = tipo==='aviso'?textoAviso:tipo==='cookies'?textoCookies:textoPrivacidad;
  document.getElementById('modal-legal').style.display = 'block';
  document.body.style.overflow = 'hidden';
}
function cerrarModal() {
  document.getElementById('modal-legal').style.display = 'none';
  document.body.style.overflow = '';
}
document.getElementById('modal-legal').addEventListener('click', function(e){ if(e.target===this) cerrarModal(); });

function aceptarCookies() {
  localStorage.setItem('bl_cookie_consent','accepted');
  document.getElementById('cookie-banner').style.display = 'none';
  activarAnalytics();
}
function rechazarCookies() {
  localStorage.setItem('bl_cookie_consent','rejected');
  document.getElementById('cookie-banner').style.display = 'none';
}
function activarAnalytics() {
  if(window._gaActivado) return; window._gaActivado=true;
  var s=document.createElement('script'); s.src='https://www.googletagmanager.com/gtag/js?id=G-QHM1133FL4'; s.async=true; document.head.appendChild(s);
  window.dataLayer=window.dataLayer||[]; function gtag(){dataLayer.push(arguments);} window.gtag=gtag;
  gtag('js',new Date()); gtag('config','G-QHM1133FL4');
}
window.addEventListener('DOMContentLoaded', function(){
  var consent = localStorage.getItem('bl_cookie_consent');
  if (!consent) { var b=document.getElementById('cookie-banner'); if(b) b.style.display='flex'; }
  if (consent==='accepted') activarAnalytics();
});
</script>
</body>
</html>
