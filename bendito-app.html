<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>App interna de contenido · Bendito Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F4F1E6; --deep:#17233F; --captain:#2F8FEA; --baby:#93ACA7;
  --sunshine:#E8C24A; --rose:#E3A29C; --poppy:#E2704A; --white:#FBF4E9;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);font-family:'Inter',sans-serif;color:var(--deep);}
h1,h2{font-family:'Helvetica World','Helvetica Neue',Helvetica,Arial,sans-serif;margin:0;}
button,input,select,textarea{font-family:inherit;}

/* LOGIN */
#login{position:fixed;inset:0;background:var(--deep);display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-box{background:#fff;padding:48px 40px;width:360px;max-width:calc(100vw - 32px);text-align:center;border-radius:10px;}
.login-title{font-weight:900;font-size:24px;color:var(--deep);letter-spacing:-.5px;margin-bottom:4px;}
.login-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:32px;}
.login-input{width:100%;padding:14px;border:1.5px solid #ddd;font-size:16px;text-align:center;letter-spacing:4px;margin-bottom:10px;outline:none;border-radius:6px;}
.login-input:focus{border-color:var(--deep);}
.login-btn{width:100%;background:var(--deep);color:var(--sunshine);border:none;font-weight:900;font-size:15px;padding:15px;cursor:pointer;border-radius:6px;}
.login-btn:hover{background:var(--captain);}
.login-err{color:#C0392B;font-size:12px;margin-top:10px;display:none;}

/* APP */
#app{display:none;min-height:100vh;padding:24px 4vw 64px;}
.app-header{text-align:center;margin-bottom:8px;}
.app-header h1{font-size:20px;font-weight:800;color:var(--deep);}
.app-header p{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--baby);margin-top:4px;}
.app-logout{position:absolute;top:20px;right:4vw;font-size:11px;font-weight:700;color:var(--baby);background:none;border:none;cursor:pointer;}

.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:24px 0 32px;}
.tab-btn{font-size:12px;font-weight:700;padding:9px 16px;border-radius:20px;border:1px solid var(--baby);background:transparent;color:var(--deep);cursor:pointer;}
.tab-btn.active{background:var(--deep);color:#fff;border-color:var(--deep);}

.panel{display:none;}
.panel.active{display:block;}

/* GENERATOR */
.gen-box{max-width:440px;margin:0 auto;background:#fff;border-radius:12px;border:1px solid #E3DFCF;padding:20px;}
.gen-box h2{font-size:16px;font-weight:800;margin-bottom:16px;}
.field-label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--baby);margin-bottom:5px;}
.field-input{width:100%;border:1px solid #ddd;border-radius:6px;padding:10px;font-size:13px;margin-bottom:16px;}
textarea.field-input{min-height:80px;resize:vertical;}
.gen-preview{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-bottom:16px;display:none;}
.btn-primary{width:100%;background:var(--deep);color:#fff;font-weight:800;padding:13px;border:none;border-radius:8px;cursor:pointer;font-size:14px;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.gen-status{font-size:12px;color:var(--baby);text-align:center;margin-top:8px;min-height:16px;}
.result-block{background:var(--cream);border-left:4px solid var(--rose);border-radius:6px;padding:12px;margin-bottom:10px;}
.result-block .rb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.result-block .rb-label{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--rose);}
.result-block p{font-size:13px;white-space:pre-line;margin:0;}
.copy-btn{font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;border:1px solid #ccc;background:var(--cream);color:var(--deep);cursor:pointer;}
.copy-btn.copied{background:var(--baby);color:#fff;border-color:var(--baby);}

/* FEED */
.feed{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
.feed-empty{text-align:center;font-size:13px;color:var(--baby);}
.post-card{background:#fff;border:1px solid #E3DFCF;border-radius:10px;overflow:hidden;position:relative;}
.post-del{position:absolute;top:8px;right:8px;z-index:2;width:24px;height:24px;border-radius:50%;background:rgba(23,35,63,.75);color:#fff;border:none;font-size:13px;cursor:pointer;}
.post-head{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;font-size:13px;}
.post-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
.post-body{padding:12px;}
.post-body p{font-size:13px;white-space:pre-line;margin:0 0 6px;}
.post-tags{font-size:13px;color:var(--captain);}
.post-copy-row{display:flex;justify-content:flex-end;padding:8px 12px;}
.wa-head{background:#25D366;color:#fff;padding:8px 12px;font-weight:700;font-size:13px;}
.wa-wrap{background:#ECE5DD;padding:12px;}
.wa-bubble{background:#fff;border-radius:10px;padding:8px;box-shadow:0 1px 2px rgba(0,0,0,.1);}
.wa-bubble img{width:100%;border-radius:6px;margin-bottom:8px;display:block;}
.wa-bubble p{font-size:13px;white-space:pre-line;margin:0;}

/* GALLERY */
.gallery{max-width:440px;margin:0 auto;}
.gallery-hint{font-size:11px;color:var(--baby);text-align:center;margin-bottom:10px;}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.gallery-item{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:#eee;}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block;}
.gallery-used{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:#25D366;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div class="login-title">BENDITO LAB</div>
    <div class="login-sub">App interna de contenido</div>
    <input type="password" class="login-input" id="pwd" placeholder="••••••••">
    <button class="login-btn" data-action="check-login">ENTRAR →</button>
    <div class="login-err" id="login-err">Contraseña incorrecta</div>
  </div>
</div>

<div id="app">
  <button class="app-logout" data-action="logout">⎋ Cerrar sesión</button>
  <div class="app-header">
    <h1>Bendito Lab &amp; Dilo Bonito</h1>
    <p>App interna de contenido</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="ig">Instagram</button>
    <button class="tab-btn" data-tab="li">LinkedIn</button>
    <button class="tab-btn" data-tab="wa">WhatsApp</button>
    <button class="tab-btn" data-tab="ai">🤖 Generador IA</button>
    <button class="tab-btn" data-tab="insp">Inspiración</button>
  </div>

  <div class="panel" data-panel="ig"><div class="feed" id="feed-ig"></div></div>
  <div class="panel" data-panel="li"><div class="feed" id="feed-li"></div></div>
  <div class="panel" data-panel="wa"><div class="feed" id="feed-wa"></div></div>
  <div class="panel" data-panel="insp"><div class="gallery" id="gallery"></div></div>

  <div class="panel" data-panel="ai">
    <div class="gen-box">
      <h2>🤖 Generador con IA</h2>

      <label class="field-label">Cuenta</label>
      <select class="field-input" id="gen-cuenta">
        <option value="bendito_lab">Bendito Lab (B2B)</option>
        <option value="dilobonito">Dilo Bonito (B2C)</option>
      </select>

      <label class="field-label">Imagen de inspiración</label>
      <input type="file" accept="image/*" id="gen-file" class="field-input" style="padding:8px;">
      <img id="gen-preview" class="gen-preview">

      <label class="field-label" id="gen-prompt-label">Prompt</label>
      <textarea class="field-input" id="gen-prompt" placeholder="Se genera solo al subir la imagen. Puedes editarlo."></textarea>

      <label class="field-label">Formato principal</label>
      <select class="field-input" id="gen-formato">
        <option value="instagram">Post Instagram</option>
        <option value="linkedin">Post LinkedIn</option>
        <option value="stories">Stories</option>
        <option value="whatsapp">Canal de WhatsApp</option>
      </select>

      <button class="btn-primary" id="gen-btn" data-action="generate">Generar con IA</button>
      <div class="gen-status" id="gen-status"></div>

      <div id="gen-result" style="display:none;margin-top:20px;padding-top:16px;border-top:1px dashed #ddd;">
        <div id="gen-blocks"></div>
        <button class="btn-primary" style="margin-top:8px;" data-action="save-post">✓ Guardar en el archivo</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/bl-api.js"></script>
<script src="/js/bendito-app-1.js"></script>
</body>
</html>
