<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bendito Lab · Enlaces</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.benditolab.com/bio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{ --poppy:#E2704A; --cream:#F4F1E6; --deep:#17233F; }
*{box-sizing:border-box;}
body{margin:0;background:var(--poppy);min-height:100vh;font-family:'Inter',sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:48px 24px;}
a{color:inherit;text-decoration:none;}
.pill:hover{opacity:.9;}
.card-wrap{max-width:420px;width:100%;text-align:center;}
.card{background:var(--cream);border-radius:28px;padding:36px 28px 40px;}
.card img.logo{height:110px;width:auto;display:block;margin:0 auto 16px;}
.tagline{font-weight:800;font-size:16px;letter-spacing:.5px;color:var(--deep);margin-bottom:32px;}
.links{display:flex;flex-direction:column;gap:18px;}
.pill{background:var(--poppy);color:var(--cream);font-weight:700;font-size:16px;padding:20px;border-radius:14px;}
.handle{margin-top:36px;font-weight:700;font-size:15px;color:var(--deep);}
</style>
  <link rel="icon" type="image/svg+xml" href="/images/eye-logo.svg">
  <link rel="apple-touch-icon" href="/icon-web-180.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icon-web-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-web-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-web-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-web-512.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

<div class="card-wrap">
  <div class="card">
    <img class="logo" src="logo-bendito.png" alt="Bendito Lab">
    <div class="tagline" data-edit="link-bio.card.tagline">PERSONALIZACIONES Y EVENTOS<br>EN DIRECTO</div>
    <div class="links">
      <a class="pill" href="bendito-lab.html">BENDITO LAB B2B →</a>
      <a class="pill" href="dilo-bonito.html">DILO BONITO →</a>
      <a class="pill" href="colaboradores.html">COLABORADORES →</a>
      <a class="pill" href="contacto.html">CONTACTO →</a>
    </div>
    <div class="handle" data-edit="link-bio.card.handle">@BENDITO_LAB</div>

    <p style="margin-top:24px;font-size:11px;color:var(--deep);opacity:.75;">
      <a href="#" data-modal="aviso" style="text-decoration:underline;">Aviso legal</a> ·
      <a href="#" data-modal="privacidad" style="text-decoration:underline;">Privacidad</a> ·
      <a href="#" data-modal="cookies" style="text-decoration:underline;">Cookies</a>
    </p>
  </div>
</div>

<div id="modal-legal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100000;overflow-y:auto;padding:40px 16px;">
  <div style="background:#fff;max-width:760px;margin:0 auto;border-radius:12px;padding:40px;font-family:Arial,sans-serif;font-size:14px;line-height:1.7;color:#222;position:relative;">
    <button id="btn-cerrar-modal" style="position:absolute;top:16px;right:20px;background:none;border:none;font-size:22px;cursor:pointer;color:#888;">✕</button>
    <div id="modal-contenido"></div>
  </div>
</div>

<div id="cookie-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#17233F;color:#fff;padding:16px 24px;z-index:99999;font-family:Arial,sans-serif;font-size:13px;box-shadow:0 -2px 12px rgba(0,0,0,0.3);align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
  <span style="flex:1;min-width:200px;">
    🍪 Usamos cookies propias y de Google Analytics para mejorar tu experiencia.
    <a href="#" data-modal="privacidad" style="color:#E8C24A;text-decoration:underline;">Privacidad</a> ·
    <a href="#" data-modal="cookies" style="color:#E8C24A;text-decoration:underline;">Cookies</a>
  </span>
  <div style="display:flex;gap:8px;flex-shrink:0;">
    <button id="btn-rechazar-cookies" style="background:transparent;border:1px solid #E8C24A;color:#E8C24A;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;">Rechazar</button>
    <button id="btn-aceptar-cookies" style="background:#E8C24A;border:none;color:#17233F;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;">Aceptar</button>
  </div>
</div>

<script src="js/link-bio-1.js"></script>
</body>
</html>
